[project]
name = "tokenstats"
version = "0.1.0"
description = "Aggregate token usage and spend across every agent CLI on your machine"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["cli", "tokens", "cost", "llm", "agent", "claude-code", "codex", "opencode", "cursor"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
tokenstats = "tokenstats.cli:app"

[project.urls]
Homepage = "https://github.com/auren23/tokenstats"
Repository = "https://github.com/auren23/tokenstats"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokenstats"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
